name: UA6 independent build
on:
  push:
    branches:
      - verification/ua6-build-20261127
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended texlive-bibtex-extra fonts-dejavu poppler-utils
      - name: Clean build using repository script
        shell: pwsh
        run: |
          ./revision/round1/ukrainian/Build-Ukrainian-Translation.ps1 -OutputDirectory "$PWD/ua6-output"
      - name: PDF and log preflight
        run: |
          cd ua6-output
          for p in *.pdf; do
            pdfinfo "$p"
            pdffonts "$p"
            pdftotext "$p" "${p%.pdf}.txt"
            sha256sum "$p"
          done
          if grep -E 'Overfull .hbox|Overfull .vbox|Missing character:|undefined references|undefined citations|duplicate destination' *.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UA6-independent-PDFs
          path: ua6-output/
          if-no-files-found: warn
