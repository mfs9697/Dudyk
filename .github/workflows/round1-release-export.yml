name: Round 1 release export
on:
  push:
    branches:
      - verification/ijf-round1-release-export
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: round1-response-source
          path: revision/round1/response_to_reviewers.md
