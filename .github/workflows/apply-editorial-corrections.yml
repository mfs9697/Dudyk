name: Apply focused editorial corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-editorial-corrections.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare one-off script
        run: |
          sed -i '142,145d' scripts/apply_editorial_corrections.py
          grep -RIl "найвід" manuscript/latex --include='*.tex' | xargs -r sed -i "s/найвід'ємніший/найменший/g; s/найвід’ємніший/найменший/g; s/найвід'ємнішим/найменшим/g; s/найвід’ємнішим/найменшим/g"
          grep -RIn "найвід" manuscript/latex --include='*.tex' || true

      - name: Apply corrections
        run: python scripts/apply_editorial_corrections.py

      - name: Normalize AQ-NR-02 in query register
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/AUTHOR_QUERIES.md')
          t = p.read_text(encoding='utf-8')
          pattern = r"\*\*Питання автору\.\*\* У новій редакції максимум \$J_i\$.*?саме так сформулювати цей результат\."
          replacement = "**Питання автору.** Чи правильно трактувати максимум $J_i$ при певних кутах не як «найменшу тріщиностійкість з'єднання», а як прояв більшої рушійної сили відгалуження і, за фіксованого $J_{i\\mathrm{c}}$, нижчого критичного зовнішнього навантаження? Я пропоную саме так сформулювати цей результат."
          t, n = re.subn(pattern, lambda m: replacement, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one AQ-NR-02 register replacement, got {n}')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/latex docs/AUTHOR_QUERIES.md
          git diff --cached --check
          git commit -m "Apply author-review editorial corrections"
          git push
