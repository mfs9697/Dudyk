name: WP2 verification

on:
  push:
    branches:
      - verification/ijf-r1-wp2-ci

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependency
        run: python -m pip install mpmath==1.3.0
      - name: Run WP2 verification
        run: python revision/round1/verify_wp2.py
      - name: Show verification result
        run: cat results/wp2_verification.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: wp2-verification
          path: results/wp2_verification.json
