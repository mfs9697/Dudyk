<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .body { fill: #fff; stroke: #888; stroke-width: 1; }
      .mat2 { fill: #ededed; stroke: none; }
      .interface { fill: none; stroke: #222; stroke-width: 2.2; }
      .crack { fill: none; stroke: #111; stroke-width: 6; stroke-linecap: butt; }
      .zone { fill: none; stroke: #111; stroke-width: 7; stroke-linecap: round; }
      .alternative { fill: none; stroke: #666; stroke-width: 5; stroke-dasharray: 10 7; stroke-linecap: butt; }
      .axis { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .dimension { fill: none; stroke: #222; stroke-width: 1.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .traction { fill: none; stroke: #222; stroke-width: 1.3; marker-end: url(#arrow); }
      text { font-family: "DejaVu Serif", serif; fill: #111; }
      .label { font-size: 21px; }
      .small { font-size: 17px; }
      .panel { font-size: 22px; font-weight: 600; }
      .math { font-style: italic; }
    </style>
  </defs>

  <!-- Panel (a): intact broken interface. -->
  <g transform="translate(0,0)">
    <rect class="body" x="28" y="32" width="344" height="260" rx="3"/>
    <path class="mat2" d="M 190 162 L 349 55 L 372 55 L 372 269 L 349 269 Z"/>
    <path class="interface" d="M 190 162 L 349 55 M 190 162 L 349 269"/>
    <path class="axis" d="M 80 162 L 352 162"/>
    <path class="interface" d="M 238 162 A 48 48 0 0 0 218 123"/>
    <circle cx="190" cy="162" r="3.4" fill="#111"/>
    <text class="label math" x="83" y="91">E₁, ν₁</text>
    <text class="label math" x="285" y="151">E₂, ν₂</text>
    <text class="small math" x="226" y="137">α</text>
    <text class="small math" x="172" y="183">O</text>
    <text class="panel" x="185" y="330" text-anchor="middle">(a)</text>
  </g>

  <!-- Panel (b): symmetric interfacial shear crack. -->
  <g transform="translate(410,0)">
    <rect class="body" x="28" y="32" width="344" height="260" rx="3"/>
    <path class="mat2" d="M 190 162 L 349 55 L 372 55 L 372 269 L 349 269 Z"/>
    <path class="interface" d="M 190 162 L 349 55 M 190 162 L 349 269"/>
    <path class="axis" d="M 80 162 L 352 162"/>
    <path class="crack" d="M 190 162 L 289 95 M 190 162 L 289 229"/>
    <path class="dimension" d="M 205 137 L 279 87"/>
    <circle cx="190" cy="162" r="3.4" fill="#111"/>
    <text class="small math" x="238" y="100">l</text>
    <text class="small math" x="172" y="183">O</text>
    <text class="label math" x="83" y="91">матеріал 1</text>
    <text class="label math" x="270" y="151">матеріал 2</text>
    <text class="panel" x="185" y="330" text-anchor="middle">(b)</text>
  </g>

  <!-- Panel (c): process zone in material 1 and the alternative in material 2. -->
  <g transform="translate(820,0)">
    <rect class="body" x="28" y="32" width="344" height="260" rx="3"/>
    <path class="mat2" d="M 190 162 L 349 55 L 372 55 L 372 269 L 349 269 Z"/>
    <path class="interface" d="M 190 162 L 349 55 M 190 162 L 349 269"/>
    <path class="axis" d="M 64 162 L 352 162"/>
    <path class="crack" d="M 190 162 L 289 95 M 190 162 L 289 229"/>
    <path class="zone" d="M 190 162 L 100 162"/>
    <path class="alternative" d="M 190 162 L 270 162"/>
    <path class="dimension" d="M 109 184 L 181 184"/>
    <path class="dimension" d="M 199 184 L 261 184"/>
    <path class="traction" d="M 140 132 L 140 154"/>
    <path class="traction" d="M 140 192 L 140 170"/>
    <circle cx="190" cy="162" r="3.4" fill="#111"/>
    <text class="small math" x="136" y="207">d₁</text>
    <text class="small math" x="222" y="207">d₂</text>
    <text class="small math" x="123" y="125">σ₁</text>
    <text class="small math" x="70" y="151">β₁=π</text>
    <text class="small math" x="281" y="151">β₂=0</text>
    <text class="small math" x="172" y="183">O</text>
    <text class="panel" x="185" y="330" text-anchor="middle">(c)</text>
  </g>
</svg>
